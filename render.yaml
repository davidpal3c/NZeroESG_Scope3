# NZeroESG public API blueprint.
# The database uses Render's current basic-1gb tier; the web service is free.
# No credentials or deploy hooks belong in this file.
services:
  - type: web
    name: nzeroesg-api
    runtime: docker
    plan: free
    region: oregon
    branch: dev
    autoDeployTrigger: checksPass
    dockerfilePath: nzeroesg-api/Dockerfile
    dockerContext: nzeroesg-api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ASSISTANT_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: https://n-zero-esg-scope3.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: DEMO_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nzeroesg-db
          property: connectionString

databases:
  - name: nzeroesg-db
    plan: basic-1gb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: nzeroesg
    user: nzeroesg
